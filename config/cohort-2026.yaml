# Cohort 2026 — NeuroPySeminar, WiSe 2026/27.
#
# SINGLE SOURCE OF TRUTH for everything that changes year to year: term dates,
# the session grid, presenter assignments, deadlines, and the per-term external
# IDs (LSF, Moodle, Google Calendar).
#
# Rollover recipe (borrowed from ../../wp7-course/config/cohort-2026.yaml):
#   1. Copy this file to cohort-<NEXT_YEAR>.yaml.
#   2. Update `term`, `term_start`, `term_end`, the `schedule` dates, and the
#      `external` IDs. The method lineup and cadence usually stay the same.
#   3. Presenters start as "TBA" and get filled in once registration closes and
#      students send their top-3 picks — "Arash takes the rest."
#   4. Apply the changes to the rendered files (docs/schedule/SemesterSchedule.html,
#      notes/CourseDescription.md, docs/announcements/index.md, docs/tools/*.html).

term: "WiSe 2026/27"
term_start: 2026-10-12   # LMU winter-semester lecture period start (Mon)
term_end:   2027-02-05   # LMU winter-semester lecture period end (Fri)
lecture_free:
  - { name: "Christmas break", from: 2026-12-24, to: 2027-01-06 }  # no lectures

max_participants: 12
language: English

# Rolling application deadline, ~2 weeks into term (last year: 2025-10-30). Confirmed.
application_deadline: 2026-10-29

